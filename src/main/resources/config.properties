# ============================================
# 语音日历工具 — 配置
# ============================================
# 配置加载优先级：环境变量 > 本文件
# 环境变量名：将 . 替换为 _ 并转大写
# 例：aliyun.asr.app.key → ALIYUN_ASR_APP_KEY
# ============================================

# --- 阿里云智能语音交互 ---
# 控制台获取：https://nls-portal.console.aliyun.com/
aliyun.asr.app.key=
aliyun.asr.access.key.id=
aliyun.asr.access.key.secret=
aliyun.asr.gateway=nls-gateway.cn-shanghai.aliyuncs.com

# --- 数据存储 ---
storage.db.path=events.db
